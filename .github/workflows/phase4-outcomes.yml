name: Phase 4 Outcomes

on:
  workflow_dispatch:

jobs:
  phase4:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: python scripts/build_universe.py
      - run: python scripts/normalize_universe.py
      - run: python scripts/phase4_outcomes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipo-edge-phase4-outcomes
          path: data/backtest/phase4_verified_outcomes.json
