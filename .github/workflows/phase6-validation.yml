name: Phase 6 Validation
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: python scripts/phase6_outcomes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipo-edge-phase6-outcomes
          path: data/backtest/phase6_verified_outcomes.json
