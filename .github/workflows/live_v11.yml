name: IPO EDGE V1.1 Live
on:
  workflow_dispatch:
  push:
    paths:
      - 'runtime/live_v11_trigger.txt'
permissions:
  contents: write
concurrency:
  group: ipo-edge-live-v11
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ipo-edge-live
    env:
      DATABASE_URL: ${{ secrets.IPO_EDGE_RUNTIME_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - name: Validate restricted live database configuration
        run: python -c "import os; assert os.environ.get('DATABASE_URL'), 'IPO EDGE restricted runtime database secret missing'; print('IPO EDGE restricted runtime database configured')"
      - run: python scripts/run_live.py
      - name: Export governed Console snapshot
        if: always()
        run: python scripts/export_console_snapshot.py
      - name: Publish Console snapshot
        if: always()
        run: |
          git config user.name "ipo-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/console_snapshot.json
          if git diff --cached --quiet; then
            echo "Console snapshot unchanged"
          else
            git commit -m "Update IPO Console snapshot [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipo-edge-live-report
          path: artifacts/
          retention-days: 30
