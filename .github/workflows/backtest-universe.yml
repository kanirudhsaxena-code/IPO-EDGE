name: Build Backtest Universe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'data/backtest/**'
      - '.github/workflows/backtest-universe.yml'
  schedule:
    - cron: '30 2 * * 1'

jobs:
  build-universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: python scripts/build_universe.py
      - uses: actions/upload-artifact@v4
        with:
          name: ipo-edge-backtest-universe
          path: data/backtest/universe_discovered.json
          retention-days: 30
