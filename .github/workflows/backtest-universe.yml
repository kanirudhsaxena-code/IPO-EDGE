name: Build Backtest Universe

on:
  workflow_dispatch:

jobs:
  build-universe:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: python scripts/build_universe.py
      - run: python scripts/normalize_universe.py
      - name: Load leakage-safe universe into Neon
        run: python scripts/load_universe.py
      - uses: actions/upload-artifact@v4
        with:
          name: ipo-edge-backtest-universe
          path: |
            data/backtest/universe_core.json
            data/backtest/outcomes_discovery_only.json
          retention-days: 30
