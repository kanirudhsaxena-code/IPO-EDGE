name: IPO EDGE Live Discovery Validation
on:
  pull_request:
    paths:
      - 'runtime/live_discovery_validation_trigger.txt'
      - 'src/ipo_edge/run_live_discovery_validation.py'
      - '.github/workflows/live-discovery-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install .
      - name: Run validation-only discovery
        run: python -m ipo_edge.run_live_discovery_validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ipo-edge-live-discovery-${{ github.run_id }}
          path: .ipo_edge/discovery_validation
          if-no-files-found: error
          retention-days: 30
