name: Neon Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_db.py'
      - '.github/workflows/db-smoke.yml'
  workflow_dispatch:

jobs:
  check-db:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg[binary]>=3.2
      - run: python scripts/check_db.py
