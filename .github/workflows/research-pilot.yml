name: April Research Pilot

on:
  workflow_dispatch:

jobs:
  research-pilot:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: python scripts/research_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: ipo-edge-april-pilot
          path: data/backtest/april_pilot_research.json
          retention-days: 30
