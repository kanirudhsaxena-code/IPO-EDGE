name: April Research Pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/ipo_edge/adapters/**'
      - 'src/ipo_edge/component_rules.py'
      - 'config/component_rules_v1.0.json'
      - 'scripts/research_pilot.py'
      - '.github/workflows/research-pilot.yml'

jobs:
  research-pilot:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: python scripts/research_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: ipo-edge-april-pilot
          path: data/backtest/april_pilot_research.json
          retention-days: 30
